[build-system]
requires = ["poetry-core>=1.8.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "earthquake_damage_ml"
version = "0.0.1"
description = "Predicting building damage levels after the 2015 Gorkha Earthquake using ML"
authors = ["Joscha Hillienhoff <116641415+joscha-hillienhoff@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "src" }]


[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.26"
pandas = "^2.2"
matplotlib = ">=3.7,<3.10"
seaborn = "^0.13"
typer = "^0.12"
loguru = "^0.7"
tqdm = "^4.66"
python-dotenv = "^1.0"
pyarrow = "^16.0"
ipykernel = "^6.29"  # for Jupyter kernel

scikit-learn = "^1.7.2"
imbalanced-learn = "^0.14.0"
mlflow = "^2.2.2"
dagshub = { version = "^0.6.3", optional = true }
scikit-optimize = "^0.10.2"
joblib = "^1.5.2"
xgboost = "^3.1.0"

[tool.poetry.extras]
dagshub = ["dagshub"]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3"
ruff = ">=0.6"
nbstripout = "^0.8"
pytest = "^8.3"
jupyter = "^1.1"

[tool.ruff]
line-length = 99
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
